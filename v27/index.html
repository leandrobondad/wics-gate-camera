<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WICS Gate Pass V27</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f3f6fa; font-family: Arial, Helvetica, sans-serif; color: #15395f; }

    #gatePassFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f6fa;
    }

    .camera-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 292px;
      z-index: 50;
      overflow: hidden;
      border: 1px solid rgba(21,57,95,.18);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 14px 38px rgba(21,57,95,.22);
      user-select: none;
    }

    .camera-head {
      min-height: 42px;
      padding: 8px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #15395f;
      color: #ffffff;
      cursor: move;
      touch-action: none;
    }

    .camera-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .8px;
    }

    .camera-pill {
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    #reader {
      width: 100%;
      min-height: 174px;
      background: #0f1720;
      overflow: hidden;
    }

    #reader video { object-fit: cover !important; }

    #cameraStatus {
      min-height: 48px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #eef4fa;
      color: #15395f;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }
    #cameraStatus.working { background: #fff6df; color: #7b5714; }
    #cameraStatus.success { background: #eaf7ef; color: #226b49; }
    #cameraStatus.error { background: #fff0f0; color: #8b1f1f; }

    #retryCamera {
      width: calc(100% - 18px);
      min-height: 40px;
      margin: 9px;
      border: 0;
      border-radius: 10px;
      background: #15395f;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .setup-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: #f3f6fa;
    }
    .setup-card {
      width: min(560px, 100%);
      padding: 26px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(21,57,95,.14);
    }
    .setup-card h1 { margin: 0 0 9px; font-size: 25px; }
    .setup-card p { margin: 0 0 18px; color: #60768d; line-height: 1.5; }
    .setup-card input {
      width: 100%; min-height: 48px; padding: 11px 12px;
      border: 2px solid #c5d2df; border-radius: 11px; font-size: 15px; outline: none;
    }
    .setup-card input:focus { border-color: #15395f; }
    .setup-card button {
      width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 11px;
      background: #15395f; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
    }
    .setup-error { min-height: 18px; margin-top: 9px; color: #a13737; font-size: 13px; font-weight: 700; }

    .settings-button {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 60;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(21,57,95,.18);
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: #15395f;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(21,57,95,.12);
    }

    @media (max-width: 600px) {
      .camera-float { width: 226px; right: 10px; bottom: 10px; border-radius: 13px; }
      .camera-head { min-height: 38px; padding: 7px 9px; }
      .camera-title { font-size: 11px; }
      .camera-pill { font-size: 9px; }
      #reader { min-height: 132px; }
      #cameraStatus { min-height: 42px; font-size: 11px; padding: 7px 8px; }
      .settings-button { left: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <iframe id="gatePassFrame" title="WICS Gate Pass V27" referrerpolicy="origin" allow="clipboard-read; clipboard-write"></iframe>

  <section id="cameraFloat" class="camera-float" hidden aria-label="QR camera scanner">
    <div id="cameraHead" class="camera-head">
      <div class="camera-title">QR CAMERA</div>
      <div class="camera-pill">CONTINUOUS</div>
    </div>
    <div id="reader"></div>
    <div id="cameraStatus">Connecting to Gate Pass…</div>
    <button id="retryCamera" type="button" hidden>RETRY CAMERA</button>
  </section>

  <button id="settingsButton" class="settings-button" type="button" title="Change Gate Pass URL">⚙</button>

  <div id="setupOverlay" class="setup-overlay" hidden>
    <div class="setup-card">
      <h1>Connect V27 Gate Pass</h1>
      <p>Paste the V27 Apps Script web app URL. This is saved only in this browser.</p>
      <input id="appUrlInput" type="url" placeholder="https://script.google.com/.../exec" autocomplete="off">
      <button id="saveAppUrl" type="button">SAVE AND OPEN GATE PASS</button>
      <div id="setupError" class="setup-error"></div>
    </div>
  </div>

  <script>
    const APP_URL_KEY = 'WICS_GATE_PASS_V27_APP_URL';
    const gatePassFrame = document.getElementById('gatePassFrame');
    const cameraFloat = document.getElementById('cameraFloat');
    const cameraStatus = document.getElementById('cameraStatus');
    const retryCamera = document.getElementById('retryCamera');
    const setupOverlay = document.getElementById('setupOverlay');
    const appUrlInput = document.getElementById('appUrlInput');
    const setupError = document.getElementById('setupError');

    let gatePassReady = false;
    let scanner = null;
    let cameraStarted = false;
    let awaitingServer = false;
    let lastAcceptedCode = '';
    let lastAcceptedAt = 0;
    let clearFramesAfterScan = 0;
    let confirmationTimer = null;
    let audioContext = null;

    function setCameraStatus(text, type) {
      cameraStatus.textContent = text;
      cameraStatus.className = type || '';
    }

    function validAppsScriptUrl(value) {
      try {
        const url = new URL(String(value || '').trim());
        return url.protocol === 'https:' &&
          (url.hostname === 'script.google.com' || url.hostname.endsWith('.googleusercontent.com'));
      } catch (error) {
        return false;
      }
    }

    function getSavedAppUrl() {
      const query = new URLSearchParams(location.search).get('app');
      if (query && validAppsScriptUrl(query)) {
        localStorage.setItem(APP_URL_KEY, query);
        return query;
      }
      return localStorage.getItem(APP_URL_KEY) || '';
    }

    function showSetup(message) {
      setupError.textContent = message || '';
      appUrlInput.value = getSavedAppUrl();
      setupOverlay.hidden = false;
      setTimeout(function(){ appUrlInput.focus(); }, 50);
    }

    function connectGatePass(url) {
      gatePassReady = false;
      cameraFloat.hidden = true;
      setCameraStatus('Connecting to Gate Pass…', '');
      gatePassFrame.src = url;
    }

    document.getElementById('saveAppUrl').addEventListener('click', function() {
      const value = String(appUrlInput.value || '').trim();
      if (!validAppsScriptUrl(value)) {
        setupError.textContent = 'Paste the HTTPS URL from your V27 Apps Script web app deployment.';
        return;
      }
      localStorage.setItem(APP_URL_KEY, value);
      setupOverlay.hidden = true;
      connectGatePass(value);
    });

    document.getElementById('settingsButton').addEventListener('click', function() {
      showSetup('');
    });

    retryCamera.addEventListener('click', function() {
      startCamera();
    });

    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (error) {}
    }

    function playTone(success) {
      try {
        if (!audioContext) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          audioContext = new Ctx();
        }
        if (audioContext.state === 'suspended') audioContext.resume().catch(function(){});
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = success ? 880 : 240;
        gain.gain.value = .055;
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + (success ? .11 : .18));
      } catch (error) {}
    }

    async function startCamera() {
      if (!gatePassReady) {
        setCameraStatus('Waiting for Gate Pass…', 'working');
        return;
      }

      retryCamera.hidden = true;
      awaitingServer = false;
      clearFramesAfterScan = 0;
      setCameraStatus('Starting camera…', '');

      if (typeof Html5Qrcode === 'undefined') {
        setCameraStatus('Camera library could not load. Check the internet connection.', 'error');
        retryCamera.hidden = false;
        return;
      }

      try {
        if (scanner) {
          try { await scanner.stop(); } catch (error) {}
          try { scanner.clear(); } catch (error) {}
        }

        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8
          ],
          verbose: false
        });

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 12,
            qrbox: function(w, h) {
              const size = Math.floor(Math.min(w, h) * .68);
              return { width: size, height: size };
            },
            aspectRatio: 1.333333
          },
          onScanSuccess,
          onScanFailure
        );

        cameraStarted = true;
        setCameraStatus('READY — next student.', '');
      } catch (error) {
        cameraStarted = false;
        setCameraStatus('Camera could not start. Allow camera permission, then retry.', 'error');
        retryCamera.hidden = false;
      }
    }

    function onScanFailure() {
      if (lastAcceptedCode) clearFramesAfterScan++;
    }

    function onScanSuccess(decodedText) {
      const studentId = String(decodedText || '').trim().toUpperCase();
      if (!studentId || awaitingServer || !gatePassReady) return;

      const now = Date.now();
      if (
        studentId === lastAcceptedCode &&
        now - lastAcceptedAt < 5000 &&
        clearFramesAfterScan < 3
      ) return;

      awaitingServer = true;
      lastAcceptedCode = studentId;
      lastAcceptedAt = now;
      clearFramesAfterScan = 0;
      setCameraStatus('CODE READ — ' + studentId + ' • saving…', 'working');

      gatePassFrame.contentWindow.postMessage(
        { type: 'WICS_GATEPASS_CAMERA_SCAN', studentId: studentId },
        '*'
      );

      if (confirmationTimer) clearTimeout(confirmationTimer);
      confirmationTimer = setTimeout(function() {
        confirmationTimer = null;
        if (!awaitingServer) return;
        setCameraStatus('Still waiting. Check Gate Pass for a staff action or error.', 'error');
      }, 15000);
    }

    window.addEventListener('message', function(event) {
      if (event.source !== gatePassFrame.contentWindow) return;
      const data = event.data || {};

      if (data.type === 'WICS_GATEPASS_BRIDGE_READY') {
        gatePassReady = true;
        cameraFloat.hidden = false;
        setCameraStatus('Gate Pass connected. Starting camera…', '');
        if (!cameraStarted) startCamera();
        return;
      }

      if (data.type !== 'WICS_GATEPASS_CAMERA_RESULT') return;

      const studentId = String(data.studentId || '').trim().toUpperCase();
      if (!studentId || studentId !== lastAcceptedCode) return;

      if (data.pending) {
        if (confirmationTimer) { clearTimeout(confirmationTimer); confirmationTimer = null; }
        awaitingServer = true;
        setCameraStatus(
          (data.status || 'STAFF ACTION REQUIRED') +
          (data.message ? ' — ' + data.message : ''),
          'working'
        );
        return;
      }

      if (confirmationTimer) { clearTimeout(confirmationTimer); confirmationTimer = null; }

      if (data.success) {
        const details = [data.studentName || studentId, data.movement || '', data.time || '']
          .filter(Boolean).join(' • ');
        setCameraStatus('✓ SAVED — ' + details, 'success');
        playTone(true);
        vibrate([90,45,90]);
        setTimeout(function() {
          awaitingServer = false;
          retryCamera.hidden = true;
          setCameraStatus('READY — next student.', '');
        }, 900);
        return;
      }

      awaitingServer = false;
      setCameraStatus(
        (data.status || 'NOT RECORDED') + (data.message ? ' — ' + data.message : ''),
        'error'
      );
      playTone(false);
      vibrate([180,80,180]);
      setTimeout(function() {
        if (!awaitingServer) setCameraStatus('READY — scan again when resolved.', '');
      }, 1800);
    });

    // Small draggable camera window. Clamp it to the viewport.
    (function enableDrag() {
      const panel = cameraFloat;
      const handle = document.getElementById('cameraHead');
      let dragging = false, dx = 0, dy = 0;

      handle.addEventListener('pointerdown', function(e) {
        dragging = true;
        const rect = panel.getBoundingClientRect();
        dx = e.clientX - rect.left;
        dy = e.clientY - rect.top;
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function(e) {
        if (!dragging) return;
        const maxX = Math.max(0, window.innerWidth - panel.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - panel.offsetHeight);
        const x = Math.max(0, Math.min(maxX, e.clientX - dx));
        const y = Math.max(0, Math.min(maxY, e.clientY - dy));
        panel.style.left = x + 'px';
        panel.style.top = y + 'px';
      });

      function stop(e) {
        if (!dragging) return;
        dragging = false;
        try { handle.releasePointerCapture(e.pointerId); } catch (error) {}
      }
      handle.addEventListener('pointerup', stop);
      handle.addEventListener('pointercancel', stop);
    })();

    const initialUrl = getSavedAppUrl();
    if (initialUrl && validAppsScriptUrl(initialUrl)) {
      connectGatePass(initialUrl);
    } else {
      showSetup('');
    }
  </script>
</body>
</html>
